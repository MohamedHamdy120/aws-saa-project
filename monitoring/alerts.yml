groups:
- name: flask
  rules:
  - alert: High5xxRate
    expr: sum(rate(flask_http_request_total{status=~"5.."}[5m])) / sum(rate(flask_http_request_total[5m])) > 0.01
    for: 2m
  - alert: HighLatencyP95
    expr: histogram_quantile(0.95, sum(rate(flask_http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
    for: 5m
